<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSE Club</title>

    <style>
        /* ----- RESET & FULL-PAGE BACKGROUND ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            /* ensure the body always fills the viewport */
        }

        body {
            /* BACKGROUND IMAGE – make sure 'cs-club.jpeg' is in the same folder */
            background-image: url('cs-club.jpeg');
            background-size: cover;
            /* cover the entire area */
            background-position: center center;
            /* center the image */
            background-repeat: no-repeat;
            /* don't tile */
            background-attachment: fixed;
            /* optional: keeps bg fixed on scroll */

            /* fallback color while image loads */
            background-color: #1a1a2e;

            /* make body a flex container so the buttons can be positioned */
            display: flex;
            align-items: flex-end;
            /* push content to bottom */
            justify-content: center;
            /* center horizontally */
            padding-bottom: 10%;
            /* space from bottom edge */
        }

        /* ----- BUTTON CONTAINER ----- */
        .buttons {
            width: 80%;
            max-width: 320px;

            position: relative;
            top: -2px;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ----- BUTTON BASE ----- */
        .buttons a {
            width: 100%;
            padding: 16px 10px;

            text-align: center;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: bold;

            border: 3px solid #222;
            border-radius: 10px;

            box-shadow: 5px 5px 0 #222;

            transition: transform 0.12s ease, box-shadow 0.12s ease;
            cursor: pointer;
        }

        /* Member button – light */
        .register-btn {
            background: white;
            color: #222;
        }

        /* Suggestions button – dark */
        .suggestion-btn {
            background: #222;
            color: white;
        }

        /* ----- HOVER & ACTIVE STATES ----- */
        .buttons a:hover {
            transform: translateY(-3px);
        }

        .buttons a:active {
            transform: translateY(2px);
            box-shadow: 2px 2px 0 #222;
        }

        /* small screens: reduce bottom padding */
        @media (max-width: 480px) {
            body {
                padding-bottom: 4%;
            }
            .buttons {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">

        <a href="https://forms.gle/xgzqPj3eXnJrMrfv6"
        target="_blank"
        class="register-btn">
        REGISTER AS A MEMBER
    </a>

    <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=o5CmdboGAEyL2B8KfgzSoDcOuSkVpPFDmP_2lnA0ncxUN1UwSEVDVFpJUk1UUERYS1NUUE9NRFgyUC4u"
    target="_blank"
    class="suggestion-btn">
    SUGGESTIONS
</a>

</div>

</body>
</html>
